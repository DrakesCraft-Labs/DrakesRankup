# DrakesRankup - Configuración Principal
settings:
  # Moneda e integración Vault
  currency-symbol: "$"
  
  # Sonido al subir de rango
  sound:
    enabled: true
    name: "entity.player.levelup"
    volume: 1.0
    pitch: 1.2

  # Título en pantalla al subir de rango
  title:
    enabled: true
    title: "&6&l¡RANGO DESBLOQUEADO!"
    subtitle: "&eHas ascendido a &b{rank}"
    fade-in: 10
    stay: 50
    fade-out: 10

  # Anuncios en el Chat de Minecraft (Broadcast global)
  broadcast:
    enabled: true
    message:
      - "&8&m--------------------------------------------------"
      - " &e&lDRAKES RANKUP &8✦ &6¡ASCENSO HISTÓRICO!"
      - " &7El jugador &f{player} &7ha alcanzado el Rango &b{rank}&7."
      - " &8[&e{division}&8] &8» &aNivel {tier} / 50"
      - "&8&m--------------------------------------------------"

  # Integración LuckPerms (Cero colisión con Dioses VIP)
  luckperms:
    enabled: true
    apply-group: true
    group-prefix: "rankup_"
    remove-previous-rankup-group: true

  # Sistema de Mantención y Desgaste (Rank Maintenance & Decay)
  maintenance:
    enabled: true
    # Duración base de cada periodo de mantención (en días)
    period-days: 14
    # Máximo acumulable de días de mantención al renovar
    max-accumulated-days: 30
    # Modo de desgaste al expirar:
    # CHECKPOINT = Vuelve al último hito/ancla permanente de su división (o a tier 0 si no tiene)
    # RESET = Vuelve directamente a Tier 0
    # SINGLE_TIER = Pierde 1 tier
    decay-mode: "CHECKPOINT"
    # Porcentaje del costo del rango que se cobra como mantención por 14 días (0.05 = 5%)
    cost-percentage: 0.05
    # Costo mínimo de mantención en Dragmas
    min-cost: 1000.0
    # Avisar al jugador al conectar si le quedan menos de X horas
    warning-threshold-hours: 72
    # Frecuencia de verificación en minutos
    check-interval-minutes: 30

messages:
  prefix: "&8[&6Rankup&8] "
  max-rank: "&a¡Felicidades! Ya has alcanzado el rango máximo (&6Rey de los Piratas / Trascendente Supremo&a)."
  insufficient-funds: "&cNo tienes suficiente dinero para subir a &b{rank}&c. Te faltan &e${missing}&c."
  success: "&a¡Has ascendido con éxito a &b{rank}&a! Se han descontado &e${cost}&a de tu cuenta."
  no-permission: "&cNo tienes permisos para ejecutar este comando."
  reload-success: "&aConfiguración y rangos recargados correctamente."
